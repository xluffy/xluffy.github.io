</span><span class=theme-toggle><svg class="theme-toggler" width="24" height="24" viewBox="0 0 48 48" fill="none"><path d="M22 41c10.4934.0 19-8.5066 19-19C41 11.5066 32.4934 3 22 3 11.5066 3 3 11.5066 3 22s8.5066 19 19 19zM7 22C7 13.7157 13.7157 7 22 7V37C13.7157 37 7 30.2843 7 22z"/></svg></span></span></span></header><div class=content><div class=post><h2>Tags</h2><style>.tags-graph-box{border:1px solid var(--border-color,#ddd);border-radius:6px;overflow:hidden;margin:1.5rem 0;background:var(--background,#fff)}.tags-graph-box svg{display:block;width:100%;height:auto;cursor:grab}.tags-graph-box svg:active{cursor:grabbing}.tags-graph-box svg text{fill:currentColor}</style><div class=tags-graph-box><svg viewBox="0 0 960 640"/></div><script type=module>
    import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";

    async function drawChart() {
      const response = await fetch("https:\/\/taoquangne.com\/graph.json");
      if (!response.ok) return;
      const json = await response.json();

      const width = 960;
      const height = 640;

      const links = json.links.map(d => ({ ...d }));
      const nodes = json.nodes.map(d => ({ ...d }));

      const simulation = d3.forceSimulation(nodes)
        .force("link", d3.forceLink(links).id(d => d.id).distance(80))
        .force("charge", d3.forceManyBody().strength(-400))
        .force("x", d3.forceX())
        .force("y", d3.forceY())
        .force("collide", d3.forceCollide()
          .radius(d => d.title ? 50 : 30)
          .strength(0.6));

      const svg = d3.select(".tags-graph-box svg")
        .attr("viewBox", [-width / 2, -height / 2, width, height]);

      
      const g = svg.append("g");

      svg.call(d3.zoom()
        .scaleExtent([0.2, 5])
        .on("zoom", (event) => {
          g.attr("transform", event.transform);
        }));

      
      const link = g.append("g")
        .attr("stroke", "#999")
        .attr("stroke-opacity", 0.5)
        .selectAll("line")
        .data(links)
        .join("line")
        .attr("stroke-width", d => Math.sqrt(d.value || 1));

      
      const node = g.append("g")
        .attr("stroke", "#fff")
        .attr("stroke-width", 1.5)
        .selectAll("circle")
        .data(nodes)
        .join("circle")
        .attr("r", d => d.title ? 10 : 7)
        .attr("fill", d => d.title ? "#B0CFFF" : "#FFA7CE")
        .style("transition", "r 0.2s ease");

      node.append("title")
        .text(d => d.title ? d.title : "#" + d.id);

      
      node.on("mouseenter", function() {
        d3.select(this).transition().duration(150).attr("r", d => (d.title ? 14 : 10));
      }).on("mouseleave", function() {
        d3.select(this).transition().duration(150).attr("r", d => (d.title ? 10 : 7));
      });

      
      node.call(d3.drag()
        .on("start", (event) => {
          if (!event.active) simulation.alphaTarget(0.3).restart();
          event.subject.fx = event.subject.x;
          event.subject.fy = event.subject.y;
        })
        .on("drag", (event) => {
          event.subject.fx = event.x;
          event.subject.fy = event.y;
        })
        .on("end", (event) => {
          if (!event.active) simulation.alphaTarget(0);
          event.subject.fx = null;
          event.subject.fy = null;
        }));

      
      const label = g.append("g")
        .attr("text-anchor", "middle")
        .selectAll("a")
        .data(nodes)
        .join("a")
        .attr("href", d => d.url)
        .append("text")
        .attr("dy", d => d.title ? "-0.85em" : "0.35em")
        .attr("font-size", d => d.title ? 12 : 10)
        .attr("font-family", d => d.title ? "inherit" : "monospace")
        .attr("fill", "currentColor")
        .text(d => d.title ? d.title : "#" + d.id);

      
      simulation.on("tick", () => {
        link
          .attr("x1", d => d.source.x)
          .attr("y1", d => d.source.y)
          .attr("x2", d => d.target.x)
          .attr("y2", d => d.target.y);

        node
          .attr("cx", d => d.x)
          .attr("cy", d => d.y);

        label
          .attr("x", d => d.x)
          .attr("y", d => d.y);
      });

      
      simulation.alpha(0.5).restart();
    }

    drawChart();
  </script></div></div><footer class=footer><div class=footer__inner><div class="copyright copyright--user"><span>hàng nhà trồng 🌴 theo <a href=https://creativecommons.org/licenses/by-nc/4.0>giấy phép CC BY-NC 4.0</a></span><span>Themes created by <a href=https://twitter.com/panr target=_blank rel=noopener>panr</a></span></div></div></footer><script src=https://taoquangne.com/assets/main.js></script><script src=https://taoquangne.com/assets/prism.js></script><script>document.addEventListener("DOMContentLoaded",function(){const e=GLightbox({selector:".glightbox",touchNavigation:!0,loop:!0,scrollLock:!1})})</script></div><noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-K62WF7M4" height=0 width=0 style=display:none;visibility:hidden></iframe></noscript></body></html>
